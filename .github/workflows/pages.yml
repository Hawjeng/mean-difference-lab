name: Publish Shiny teaching app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find verified runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/update-export.py find-base
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: baseline
          run-id: ${{ env.BASE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Refresh and verify application sources
        run: python .github/scripts/update-export.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
